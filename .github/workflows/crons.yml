# Godzilla schedulers. Vercel Hobby crons only fire once a day and are
# best-effort, which made Mary's replies look ignored for up to 24 hours
# (Benjy 7/27). GitHub Actions is free and reliable, so the agent inbox is
# polled every 15 minutes here; the daily jobs keep their once-a-day slot.
# REQUIRES repo secret CRON_SECRET (same value as the Vercel env var).
name: daily-crons

on:
  schedule:
    - cron: "0 16 * * *"     # DAILY SAFETY NET only — Vercel Pro crons are primary
                             # (agent-inbox every 15 min in vercel.json)
  workflow_dispatch: {}

# A new poll supersedes one still running; never pile up.
concurrency:
  group: godzilla-crons
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the cron endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          hit () {
            echo "→ $1"
            # --fail-with-body: a 401/500 turns the run RED instead of passing
            # silently, so a broken secret can never hide (Benjy 7/27).
            curl -sS --fail-with-body -m 300 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://packaging.cndprinting.com/api/cron/$1" | head -c 500
            echo
          }
          # The agent inbox runs on every trigger — this is the responsiveness fix.
          hit agent-inbox
          # Daily work: the 16:00 UTC trigger, or a manual run.
          if [ "$(date -u +%H%M)" = "1600" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            hit pipeline-reminders
            hit outbound
          fi
